# Jekyll config for the GitHub Pages site (source: main / docs).
# Keep this minimal — the site only hosts the privacy policy and a small
# landing page for Web Store reviewers, not a full documentation site.

title: Photo EXIF Util
description: Privacy-first Chrome extension for inspecting, stripping, and SNS-optimizing image EXIF metadata — fully client-side.
theme: jekyll-theme-minimal

# 拡張子無しの URL を有効にする (PRIVACY.md → /PRIVACY)
permalink: pretty

# Web Store reviewers 向けの素材は repo 側にあるので Pages では不要
exclude:
  - STORE_LISTING.md
  - RELEASE.md
